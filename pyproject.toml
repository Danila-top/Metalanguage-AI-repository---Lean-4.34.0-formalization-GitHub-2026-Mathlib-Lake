[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qet-ml"
version = "0.1.0"
description = "Reference implementation for the formal QET-ML metalanguage"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43",
  "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "reference"}
py-modules = ["qet_codec"]

[tool.pytest.ini_options]
pythonpath = ["reference"]
